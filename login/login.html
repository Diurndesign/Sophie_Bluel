<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace atelier · Atelier Chaux</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index/index.css">
  <link rel="stylesheet" href="./login.css">
</head>
<body class="login-page">
  <main class="login">
    <figure class="login__media" aria-hidden="true">
      <img src="../assets/images/hotel-first-arte-new-delhi.png" alt="" width="608" height="810">
    </figure>

    <section class="login__panel" aria-labelledby="loginTitle">
      <a class="brand" href="../index.html">
        <span class="brand__name">Atelier Chaux</span>
        <span class="brand__tag">Architecture intérieure</span>
      </a>

      <div class="login__box">
        <p class="eyebrow">Espace atelier</p>
        <h1 id="loginTitle">Gérer les projets publiés</h1>
        <p class="login__lead">Connectez-vous pour ajouter ou retirer des réalisations de la galerie.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="password">
              <input type="password" name="password" id="password" autocomplete="current-password" required>
              <button type="button" class="password__toggle" id="togglePassword" aria-pressed="false">Afficher</button>
            </div>
          </div>
          <p class="form-msg" id="errorMessage" role="alert"></p>
          <button type="submit" class="btn btn--dark btn--block" id="loginSubmit">Se connecter</button>
        </form>
      </div>

      <a class="login__back" href="../index.html">← Retour au site</a>
    </section>
  </main>

  <script src="../demo/demo-api.js"></script>
  <script src="./login.js"></script>
</body>
</html>
